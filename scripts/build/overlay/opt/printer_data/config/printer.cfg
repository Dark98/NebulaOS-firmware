# OpenKE ke-mainline-klipper - deliberately minimal test config (2026-07-19,
# FIRMWARE.md sec 13 app-stack plan). Only wires the [mcu] serial connection
# so Klipper can at least reach a real ready/error state during the
# step-1-7 proof-of-pipeline build - NOT a real, complete printer config.
#
# /dev/ttyS1 is carried over from real, confirmed live-device forensics this
# session (klippy's own host process on the stock device held /dev/ttyS1
# open) - not fabricated, but also not yet re-confirmed against this custom
# kernel/rootfs on real hardware. Full kinematics/steppers/heater/endstop
# pin mapping deliberately NOT written here - inventing pin names without
# real hardware confirmation would be actively misleading. That real config
# authorship is real-hardware-validation work (item 8 in FIRMWARE.md sec 13),
# not part of this proof-of-pipeline pass.

[mcu]
serial: /dev/ttyS1

[printer]
kinematics: cartesian
max_velocity: 300
max_accel: 3000
max_z_velocity: 5
max_z_accel: 100
