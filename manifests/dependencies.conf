# Virgin-Baseline Fix + Rebuild mission (2026-08-08): git.linuxtv.org (the
# canonical upstream) had a real, observed outage (502/504) mid-build,
# twice, on two separate fresh-clone attempts. V4L_UTILS_REPO/PIN remain
# the source of truth for identity (never changed by this fix - same
# commit, same project) but 00-fetch-vendor-sources.sh now fetches the
# actual bytes from a deterministic, SHA256-pinned archive instead of a
# live git clone, removing this one third-party server from the build's
# critical path. The archive was built from a mirror (github.com/gjasny/
# v4l-utils) only after independently verifying, via git's own content-
# addressed commit hash, that its copy of this exact commit is byte-
# identical to what git.linuxtv.org itself would serve - see that
# release's own notes for the full verification record.
V4L_UTILS_REPO=https://git.linuxtv.org/v4l-utils.git
