name: Build firmware

on:
  workflow_dispatch: {}
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read
  packages: read

concurrency:
  group: nebulaos-firmware-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 360

    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          # The build compares the generated configuration against the
          # explicitly promoted QUALIFIED_BASELINE_TAG in dependencies.conf.
          # A shallow checkout omits that tag and makes the otherwise-valid
          # baseline fail before the build starts.
          fetch-depth: 0

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Keep the pinned source checkouts, Buildroot download cache, and
      # application-stage downloads. This cache uses a run-specific key so a
      # failed fetch/build can publish a more complete state for the next run.
      - name: Restore dependency cache
        id: dependency-cache
        uses: actions/cache/restore@v4
        with:
          path: .cache/nebulaos
          key: nebulaos-dependencies-v2-${{ runner.os }}-${{ hashFiles('manifests/dependencies.conf') }}-${{ github.run_id }}
          restore-keys: |
            nebulaos-dependencies-v2-${{ runner.os }}-${{ hashFiles('manifests/dependencies.conf') }}-

      # Preserve the generated Buildroot state separately so a later run of
      # the same build inputs can resume after an incomplete toolchain or
      # package build. The internal build path is fixed by build.sh, and the
      # key changes whenever build-affecting inputs change.
      - name: Prepare Buildroot output cache directory
        shell: bash
        run: mkdir -p vendor/buildroot-x2000/output

      - name: Restore Buildroot output cache
        id: build-cache
        uses: actions/cache/restore@v4
        with:
          path: vendor/buildroot-x2000/output
          # Assertion-only changes do not invalidate the compiled Buildroot
          # state, so a comparator fix can reuse the failed run's output.
          key: nebulaos-build-v2-${{ runner.os }}-${{ hashFiles('build.sh', 'scripts/build/00-*.sh', 'scripts/build/01-*.sh', 'scripts/build/02-*.sh', 'scripts/build/03-*.sh', 'scripts/build/04-*.sh', 'scripts/build/05-*.sh', 'scripts/build/apply-qualified-baseline.sh', 'scripts/build/*-variant.sh', 'scripts/build/overlay/etc/**', '!scripts/build/overlay/etc/default/dropbear', 'scripts/build/overlay/opt/printer_data/**', 'scripts/build/overlay/opt/nebulaos/**', 'scripts/build/overlay/opt/guppyscreen/guppyconfig.json', 'scripts/build/overlay/opt/guppyscreen/themes/**', 'scripts/build/overlay/usr/**', 'scripts/build/vendor-wheels/**', 'scripts/build/vendor-patches/**', 'artifacts/buildroot-halley5-v30-image/*.config', 'artifacts/buildroot-halley5-v30-image/*.dts', 'manifests/dependencies.conf') }}-${{ github.run_id }}
          restore-keys: |
            nebulaos-build-v2-${{ runner.os }}-${{ hashFiles('build.sh', 'scripts/build/00-*.sh', 'scripts/build/01-*.sh', 'scripts/build/02-*.sh', 'scripts/build/03-*.sh', 'scripts/build/04-*.sh', 'scripts/build/05-*.sh', 'scripts/build/apply-qualified-baseline.sh', 'scripts/build/*-variant.sh', 'scripts/build/overlay/etc/**', '!scripts/build/overlay/etc/default/dropbear', 'scripts/build/overlay/opt/printer_data/**', 'scripts/build/overlay/opt/nebulaos/**', 'scripts/build/overlay/opt/guppyscreen/guppyconfig.json', 'scripts/build/overlay/opt/guppyscreen/themes/**', 'scripts/build/overlay/usr/**', 'scripts/build/vendor-wheels/**', 'scripts/build/vendor-patches/**', 'artifacts/buildroot-halley5-v30-image/*.config', 'artifacts/buildroot-halley5-v30-image/*.dts', 'manifests/dependencies.conf') }}-

      - name: Materialize dependency cache
        shell: bash
        run: |
          set -euo pipefail

          if [[ -d .cache/nebulaos/vendor ]]; then
            mkdir -p vendor
            rsync -a .cache/nebulaos/vendor/ vendor/
          fi

          if [[ -d .cache/nebulaos/buildroot-dl ]]; then
            mkdir -p vendor/buildroot-x2000/output/dl
            rsync -a .cache/nebulaos/buildroot-dl/ vendor/buildroot-x2000/output/dl/
          fi

          if [[ -d .cache/nebulaos/vendor-downloads ]]; then
            mkdir -p vendor-downloads
            rsync -a .cache/nebulaos/vendor-downloads/ vendor-downloads/
          fi

          if [[ -d .cache/nebulaos/build-work ]]; then
            mkdir -p build-work
            rsync -a .cache/nebulaos/build-work/ build-work/
          fi

          if [[ -d .cache/nebulaos/firmware ]]; then
            mkdir -p scripts/build/overlay/lib/firmware
            rsync -a .cache/nebulaos/firmware/ scripts/build/overlay/lib/firmware/
          fi

      - name: Build and verify firmware
        id: build
        run: ./build.sh

      # Run even when ./build.sh fails. This stages the source/download state
      # for the dependency cache; the separate Buildroot output cache is saved
      # directly below. Both save steps are best-effort so a cache-size or
      # cache-service problem never hides the real build failure.
      - name: Prepare dependency cache for next run
        if: always()
        shell: bash
        run: |
          set -euo pipefail

          rm -rf .cache/nebulaos
          mkdir -p .cache/nebulaos/vendor

          # Preserve source checkouts and git metadata, but omit the generated
          # Buildroot output tree. It is rebuilt by the canonical pipeline.
          if [[ -d vendor ]]; then
            rsync -a --exclude='buildroot-x2000/output/' vendor/ .cache/nebulaos/vendor/
          fi

          if [[ -d vendor/buildroot-x2000/output/dl ]]; then
            mkdir -p .cache/nebulaos/buildroot-dl
            rsync -a vendor/buildroot-x2000/output/dl/ .cache/nebulaos/buildroot-dl/
          fi

          if [[ -d vendor-downloads ]]; then
            mkdir -p .cache/nebulaos/vendor-downloads
            rsync -a vendor-downloads/ .cache/nebulaos/vendor-downloads/
          fi

          if [[ -d build-work ]]; then
            mkdir -p .cache/nebulaos/build-work
            rsync -a build-work/ .cache/nebulaos/build-work/
          fi

          if [[ -d scripts/build/overlay/lib/firmware ]]; then
            mkdir -p .cache/nebulaos/firmware
            rsync -a scripts/build/overlay/lib/firmware/ .cache/nebulaos/firmware/
          fi

      - name: Save dependency cache
        if: always()
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: .cache/nebulaos
          key: nebulaos-dependencies-v2-${{ runner.os }}-${{ hashFiles('manifests/dependencies.conf') }}-${{ github.run_id }}

      - name: Save Buildroot output cache
        if: always()
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: vendor/buildroot-x2000/output
          key: nebulaos-build-v2-${{ runner.os }}-${{ hashFiles('build.sh', 'scripts/build/00-*.sh', 'scripts/build/01-*.sh', 'scripts/build/02-*.sh', 'scripts/build/03-*.sh', 'scripts/build/04-*.sh', 'scripts/build/05-*.sh', 'scripts/build/apply-qualified-baseline.sh', 'scripts/build/*-variant.sh', 'scripts/build/overlay/etc/**', '!scripts/build/overlay/etc/default/dropbear', 'scripts/build/overlay/opt/printer_data/**', 'scripts/build/overlay/opt/nebulaos/**', 'scripts/build/overlay/opt/guppyscreen/guppyconfig.json', 'scripts/build/overlay/opt/guppyscreen/themes/**', 'scripts/build/overlay/usr/**', 'scripts/build/vendor-wheels/**', 'scripts/build/vendor-patches/**', 'artifacts/buildroot-halley5-v30-image/*.config', 'artifacts/buildroot-halley5-v30-image/*.dts', 'manifests/dependencies.conf') }}-${{ github.run_id }}

      - name: Collect failure diagnostics
        if: steps.build.outcome == 'failure'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ci-diagnostics
          for file in \
            artifacts/buildroot-halley5-v30-image/kernel.config \
            artifacts/buildroot-halley5-v30-image/buildroot.config \
            artifacts/buildroot-halley5-v30-image/halley5_v30.dts \
            artifacts/buildroot-halley5-v30-image/build-manifest.txt; do
            if [[ -f "$file" ]]; then
              cp "$file" ci-diagnostics/
            fi
          done
          git status --short > ci-diagnostics/git-status.txt
          du -sh vendor/buildroot-x2000/output 2>/dev/null > ci-diagnostics/buildroot-output-size.txt || true

      - name: Upload failure diagnostics
        if: steps.build.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: nebulaos-build-diagnostics-${{ github.sha }}
          path: ci-diagnostics/
          if-no-files-found: warn
          retention-days: 14

      - name: Assemble artifact bundle
        shell: bash
        run: |
          set -euo pipefail

          image_dir=artifacts/buildroot-halley5-v30-image
          bundle=ci-artifacts
          mkdir -p "$bundle/images" "$bundle/guppyscreen"

          cp "$image_dir/xImage" \
             "$image_dir/rootfs.ext2" \
             "$image_dir/rootfs.squashfs" \
             "$image_dir/build-manifest.txt" \
             "$image_dir/kernel.config" \
             "$image_dir/buildroot.config" \
             "$image_dir/halley5_v30.dts" \
             "$bundle/images/"
          cp artifacts/guppyscreen-mips/guppyscreen \
             artifacts/guppyscreen-mips/guppybeep \
             "$bundle/guppyscreen/"
          cp manifests/dependencies.conf "$bundle/"

          (
            cd "$bundle"
            find . -type f ! -name SHA256SUMS -print0 \
              | sort -z \
              | xargs -0 sha256sum
          ) > "$bundle/SHA256SUMS"

      - name: Upload firmware artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nebulaos-firmware-${{ github.sha }}
          path: ci-artifacts/
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
