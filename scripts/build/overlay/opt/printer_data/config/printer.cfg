# Ender-3V3KE - real hardware config, adapted from the real device's own
# printer.cfg (fetched read-only via SSH, 2026-07-19, printer confirmed idle
# via a fresh print_stats check first) for SimpleAF's Klipper fork
# (FIRMWARE.md sec 13-17's app-stack plan) rather than Creality's own fork.
#
# Deliberately REMOVED from the real fetched config, and why:
#   - Most [include ...] lines (sensorless.cfg, gcode_macro.cfg,
#     printer_params.cfg, Helper-Script/*.cfg) - none of these files exist in
#     this environment; they're Creality-fork-specific. GuppyScreen/guppy_cmd.cfg
#     is one exception - it's this project's own port of the real
#     GuppyScreen project's base config (~/Documents/guppyscreen/k1/scripts/),
#     included below now that GuppyScreen itself is integrated (FIRMWARE.md
#     sec 40-41, and the userspace GuppyScreen-startup work that added the
#     persistent storage this depends on).
#   - [prtouch_v2] / [z_compensate] - Creality-specific load-cell modules,
#     not present in SimpleAF's fork. This is exactly the gap Track 1's own
#     klippy_extras/ work (prtouch_v2.py, z_compensate.py, etc. - see
#     ~/Documents/ke-mainline-klipper/klippy_extras/) was written to fill -
#     wiring those in here remains real, separate, DEFERRED future work
#     (see docs/NEBULAOS_SIMPLEAF_BACKEND_INTEGRATION.md) - this release is
#     BLTouch-only for Z homing and bed mesh, on purpose.
#   - [bl24c16f] / [mcu rpi] / [adxl345] / [resonance_tester] - all depend on
#     a separate host-side "klipper_mcu" helper binary (confirmed running on
#     the real device, using /dev/i2c-2 and /dev/spidev2.0) that this
#     app-stack build does not include. Real, separate, out-of-scope work if
#     input-shaper calibration/EEPROM access is wanted later. (GuppyScreen's
#     own input-shaper macros already assume this and are guarded/inert
#     without it, unchanged from before.)
#   - The real device's SAVE_CONFIG block (bed_mesh/input_shaper/axis_twist
#     calibration data, TMC autotune) - all measured against the OLD stock
#     kernel/firmware combination; real hardware validation on this new
#     build should re-calibrate fresh rather than trust carried-over numbers
#     blindly, and autotune_tmc specifically isn't confirmed present in
#     SimpleAF's fork at all.
#
# SimpleAF backend integration (2026-07-29, see docs/
# NEBULAOS_SIMPLEAF_BACKEND_INTEGRATION.md): frontend-controls.cfg's
# [include] was REMOVED from here - its virtual_sdcard/pause_resume/
# display_status/PAUSE/RESUME/CANCEL_PRINT sections are now superseded by the
# vendored simpleaf/client.cfg + simpleaf/start_end.cfg included below, which
# provide the same Mainsail-detection-safe [gcode_macro PAUSE/RESUME/
# CANCEL_PRINT] sections plus the full SimpleAF print-lifecycle workflow
# (START_PRINT/END_PRINT/idle_timeout/adaptive bed mesh/material load-unload).
# frontend-controls.cfg itself is left on disk, unincluded, as a fallback
# reference - do not include both, Klipper will refuse to load two
# definitions of the same section.

[include GuppyScreen/guppy_cmd.cfg]

[tmcstatus]

[firmware_retraction]
retract_length: 0.6
retract_speed: 35
unretract_extra_length: 0
unretract_speed: 30

[mcu]
serial: /dev/ttyS1
baud: 230400
restart_method: command

# [force_move] is defined by simpleaf/homing.cfg (included below) - do not
# redefine it here, Klipper rejects a section defined twice.

[printer]
kinematics: cartesian
max_velocity: 500
max_accel: 8000
# ke-mainline-klipper stock-parity mission: max_accel_to_decel is
# deprecated upstream; 0.6875 = 1 - min(1, max_accel_to_decel/max_accel)
# is the exact equivalent per this build's own toolhead.py, so this is a
# zero-behavior-change migration (see the deployed device's printer.cfg
# for the fuller explanation).
minimum_cruise_ratio: 0.6875
max_z_velocity: 30
square_corner_velocity: 5.0
max_z_accel: 300

[stepper_x]
step_pin: PC2
dir_pin: !PB9
enable_pin: !PC3
microsteps: 16
rotation_distance: 40
endstop_pin: !PA5
position_endstop: -12
position_min: -12
position_max: 221
homing_speed: 30
homing_retract_dist: 0

[tmc2208 stepper_x]
uart_pin: PB12
interpolate: True
run_current: 0.75
sense_resistor: 0.150
stealthchop_threshold: 0

[stepper_y]
step_pin: PB8
dir_pin: PB7
enable_pin: !PC3
microsteps: 16
rotation_distance: 60
endstop_pin: !PA6
position_endstop: -20
position_min: -20
position_max: 223
homing_speed: 30
homing_retract_dist: 0

[tmc2208 stepper_y]
uart_pin: PB13
interpolate: True
run_current: 0.75
sense_resistor: 0.150
stealthchop_threshold: 0

[stepper_z]
step_pin: PB6
dir_pin: !PB5
enable_pin: !PC3
microsteps: 16
rotation_distance: 8
endstop_pin: probe:z_virtual_endstop
position_max: 246
position_min: -5

[tmc2208 stepper_z]
uart_pin: PB14
interpolate: True
run_current: 0.8
stealthchop_threshold: 0
sense_resistor: 0.150

[bltouch]
sensor_pin: PC14
control_pin: PC13
x_offset: 0
y_offset: 27
# Real bug found live (Moonraker update/camera implementation mission,
# 2026-07-27): z_offset is a required option for Klipper's bltouch.py
# extra - with no value at all, Klipper hard-fails to load
# ("Option 'z_offset' in section 'bltouch' must be specified"), which
# blocks the whole printer from ever becoming ready. This went
# undiscovered for the entire project because until this mission's own
# Phase I clean-install test, printer.cfg had never actually been
# reseeded from this squashfs default on a truly empty namespace - every
# earlier real-device session already had an already-configured,
# already-calibrated printer.cfg in place. The original omission here was
# deliberate (see this file's own header: the real device's SAVE_CONFIG
# block, including its calibrated z_offset, was intentionally dropped
# since it was measured against the old stock kernel/firmware and
# shouldn't be trusted blindly on this build) - but omitting the value
# entirely broke Klipper's ability to start at all, which is worse than
# shipping an explicit, safe starting point. 0 is the correct fresh-install
# default for this exact reason: it cannot cause the nozzle to crash into
# the bed (unlike a stale negative value would risk), and PROBE_CALIBRATE
# must still be run before real printing to get the true, correct value
# for this physical printer.
z_offset: 0
probe_with_touch_mode: true
stow_on_each_sample: false
speed: 5
lift_speed: 20

[output_pin MainBoardFan]
pin: !PB1

[extruder]
max_extrude_only_distance: 1000
max_extrude_cross_section: 80
pressure_advance: 0.036
step_pin: PB4
dir_pin: PB3
enable_pin: !PC3
microsteps: 16
rotation_distance: 7.53
nozzle_diameter: 0.400
filament_diameter: 1.750
heater_pin: PA1
sensor_type: EPCOS 100K B57560G104F
sensor_pin: PC5
control: pid
pid_Kp: 20.584
pid_Ki: 1.737
pid_Kd: 60.981
min_temp: 0
max_temp: 320

[heater_bed]
heater_pin: PB2
sensor_type: EPCOS 100K B57560G104F
sensor_pin: PC4
control: pid
pid_kp: 70.652
pid_ki: 1.798
pid_kd: 694.157
min_temp: 0
max_temp: 120

[verify_heater extruder]
[verify_heater heater_bed]
check_gain_time: 120
heating_gain: 1.0
hysteresis: 10

[temperature_sensor mcu_temp]
sensor_type: temperature_mcu
min_temp: 0
max_temp: 100

[output_pin fan0]
pin: PA0
pwm: True
cycle_time: 0.0100
hardware_pwm: false
value: 0.00
scale: 255
shutdown_value: 0.0

[heater_fan nozzle_fan]
pin: PC1
max_power: 1.0
shutdown_speed: 0
cycle_time: 0.010
hardware_pwm: False
kick_start_time: 0.100
off_below: 0.0
heater: extruder
fan_speed: 1.0
heater_temp: 60.0

[bed_mesh]
speed: 350
mesh_min: 5,10
mesh_max: 215,215
probe_count: 9,9
algorithm: bicubic
fade_start: 1
fade_end: 10
fade_target: 0
horizontal_move_z: 8

[input_shaper]

[skew_correction]

# Required by simpleaf/start_end.cfg's adaptive bed mesh and simpleaf/
# Smart_Park.cfg + simpleaf/Line_Purge.cfg (all read printer.exclude_object.objects
# unconditionally) - without this section that access raises a Jinja
# UndefinedError and START_PRINT fails outright. Moonraker's
# [file_manager] enable_object_processing (moonraker.conf) populates this
# with real per-object polygons from the sliced gcode; with it absent this
# just stays an empty list, which every consumer already handles safely.
[exclude_object]

# --- SimpleAF workflow layer (2026-07-29, see docs/
# NEBULAOS_SIMPLEAF_BACKEND_INTEGRATION.md) - vendored from pellcorp/creality,
# below the hardware section on purpose: simpleaf/bltouch_macro.cfg's
# BED_MESH_CALIBRATE rename_existing needs [bed_mesh] above to already be
# loaded, and simpleaf/start_end.cfg's CANCEL_PRINT rename_existing needs
# simpleaf/client.cfg's [pause_resume] (which registers the real, native
# PAUSE/RESUME/CANCEL_PRINT commands - confirmed directly against
# vendor/klipper/klippy/extras/pause_resume.py, not virtual_sdcard.py) to have
# already loaded, which is why client.cfg is included before start_end.cfg
# here even though pellcorp/creality's own installer copies the files in a
# different chronological order (that order reflects install-script actions,
# not the resulting include-list order in the assembled printer.cfg).
#
# simpleaf/homing.cfg carries one real, direct patch (found live during
# physical qualification, 2026-07-30) - see that file's own header and its
# [gcode_macro _PRE_HOME_Z] section for the fix and why it was needed.
[include simpleaf/homing.cfg]
[include simpleaf/useful_macros.cfg]
[include simpleaf/fan_control.cfg]
[include simpleaf/client.cfg]
[include simpleaf/start_end.cfg]
[include simpleaf/Line_Purge.cfg]
[include simpleaf/Smart_Park.cfg]
[include simpleaf/bltouch_macro.cfg]
