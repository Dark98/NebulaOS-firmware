# Standard Klipper print-control objects (mainline print-controls mission,
# 2026-07-29 - see docs/NEBULAOS_FRONTEND_PRINT_CONTROLS.md for the full
# source-precedence decision record). Restores virtual_sdcard/pause_resume/
# display_status, which this fork's own pause_resume.py and virtual_sdcard.py
# already implement PAUSE/RESUME/CANCEL_PRINT and print_stats through
# directly.
#
# Live evidence (2026-07-29 addendum) showed Mainsail's own frontend checks
# configfile.settings for literal [gcode_macro PAUSE]/[gcode_macro RESUME]/
# [gcode_macro CANCEL_PRINT] config sections, not just whether the commands
# work at runtime - pause_resume.py registering them as plain commands was
# not enough to clear that specific warning. The three macros below are
# pure pass-through wrappers (rename_existing + an immediate call to the
# renamed base command) - zero added behavior, so every safety property
# already established for the native implementation (no unsafe Z lift, no
# heater changes, no homing) is preserved exactly.
#
# This is the single, reviewed source of truth for: virtual_sdcard,
# pause_resume, display_status, PAUSE, RESUME, CANCEL_PRINT. Do not add a
# second definition of any of these anywhere else in this config closure.

[virtual_sdcard]
path: /opt/printer_data/gcodes
on_error_gcode: CANCEL_PRINT

[pause_resume]

[display_status]

[gcode_macro PAUSE]
rename_existing: BASE_PAUSE
gcode:
  BASE_PAUSE

[gcode_macro RESUME]
rename_existing: BASE_RESUME
gcode:
  BASE_RESUME

[gcode_macro CANCEL_PRINT]
rename_existing: BASE_CANCEL_PRINT
gcode:
  BASE_CANCEL_PRINT
