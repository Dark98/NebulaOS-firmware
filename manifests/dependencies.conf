# Authoritative dependency pin manifest for the NebulaOS firmware build.
#
# One rule: every external source this build depends on has its exact pinned
# ref recorded HERE, and nowhere else. scripts/build/00-fetch-vendor-sources.sh
# sources this file rather than hardcoding pins inline (previously each pin
# lived as a shell variable scattered across that script - functionally
# equivalent, but "the one obvious authoritative file" wasn't obvious).
#
# Format: plain shell variable assignments (this file is `.`-sourced by
# 00-fetch-vendor-sources.sh directly - no parsing dependency, no jq/python
# needed this early in the pipeline). Comments and blank lines allowed.
#
# To bump a pin: edit the value below, in its own reviewed commit, then
# re-run 00-fetch-vendor-sources.sh - it fails loudly if the ref doesn't
# resolve, and re-verifies every pin on every run (not just first clone).
#
# A dependency with NO entry here, or an entry left as the placeholder
# UNPINNED_MUST_SET_BEFORE_BUILD, causes 00-fetch-vendor-sources.sh to fail
# immediately, by design - see its own "required pin" check.

# --- Kernel (coreflake1/NebulaOS, `openke` branch, sparse-checked-out) ---
KERNEL_REPO=https://github.com/coreflake1/NebulaOS.git
KERNEL_BRANCH=openke
KERNEL_PIN=295b7101d751fd888ae39e6f1746a4a940664a5f

