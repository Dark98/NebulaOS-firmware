# NebulaOS (ke-mainline-klipper) - Moonraker config for the app-stack proof-of-
# pipeline build (FIRMWARE.md sec 13). klippy_uds_address matches the
# APISOCK path in S55klipper's own invocation of klippy.py.

[server]
host: 0.0.0.0
port: 7125
klippy_uds_address: /opt/printer_data/comms/klippy.sock

# OpenKE addition (FIRMWARE.md sec 13, stock-parity investigation): without
# a [machine] section, Moonraker defaults to the "systemd_cli" provider,
# which fails outright on this Buildroot/BusyBox image ("The name
# org.freedesktop.systemd1 was not provided by any .service files") since
# there's no systemd or D-Bus service manager here. Stock's own real
# Moonraker install (Creality-Helper-Script, /usr/data/printer_data/config/
# moonraker.conf on the same physical device) uses the exact same values
# below, paired with a real, proven /usr/bin/supervisorctl shim (see that
# file's own header) that drives our /etc/init.d/S* scripts directly - no
# systemd, no real supervisord daemon needed either. validate_service/
# validate_config are real Moonraker options (not warning suppression);
# stock disables them because supervisorctl.d config-file validation
# doesn't apply to this shim.
[machine]
provider: supervisord_cli
validate_service: False
validate_config: False

# USB/webcam stock-parity mission (2026-07-26): without this, a genuinely
# fresh install has no webcam entry in Moonraker's database at all (Mainsail
# shows no camera panel, even though the real UVC webcam and its
# pellcorp/k1-ustreamer pipeline - S50webcam, /usr/bin/ustreamer, the nginx
# /webcam/ proxy - all work correctly on their own). This seeds one real
# entry pointing at that real pipeline, matching mjpg-streamer's classic
# ?action=stream/?action=snapshot query-string API, which ustreamer itself
# also answers to (confirmed live: /webcam/?action=snapshot returns a real
# JPEG through nginx). Loaded once at first boot - Moonraker copies [webcam]
# sections into its own database as source "config" the first time it sees
# them, and this section becomes inert on any boot after that (further
# edits here won't reach an already-provisioned device without updating its
# webcam entry directly, e.g. via Mainsail's own webcam settings UI).
[webcam Nebula]
location: printer
service: mjpegstreamer-adaptive
target_fps: 15
target_fps_idle: 5
stream_url: /webcam/?action=stream
snapshot_url: /webcam/?action=snapshot
aspect_ratio: 16:9

# NebulaOS mutable-runtime mission, Phase 10: Update Manager. Shape
# confirmed directly against SimpleAF's own real, currently-shipping
# k1/moonraker.conf (pellcorp/creality, fetched 2026-07-26) -
# enable_system_updates: False matches exactly (no general Linux
# package updater ever exposed through Moonraker); Klipper/Moonraker as
# git-repo/dev-channel updates and Mainsail as a release/beta-channel
# update both match that reference's shape. Deliberate difference: no
# pinned_commit on klipper/moonraker (SimpleAF pins hard; this mission's
# own goal is user-updatable Klipper/Moonraker) - compatibility control
# instead comes from the two-stage health check + rollback design in
# docs/NEBULAOS_UPDATE_AND_ROLLBACK_DESIGN.md, not a moving-forward-never
# pin. No [update_manager guppyscreen] section exists at all - GuppyScreen
# stays served from its immutable /opt/guppyscreen copy this mission,
# updating it is explicitly a separate, future mission.
[update_manager]
enable_auto_refresh: True
refresh_interval: 168
enable_system_updates: False

[update_manager klipper]
type: git_repo
channel: dev
path: /usr/data/nebulaos/apps/klipper
origin: https://github.com/coreflake1/NebulaOS-klipper.git
primary_branch: nebulaos
managed_services: klipper

[update_manager moonraker]
type: git_repo
channel: dev
path: /usr/data/nebulaos/apps/moonraker
origin: https://github.com/Arksine/moonraker.git
primary_branch: master
managed_services: moonraker
virtualenv: /usr/data/nebulaos/envs/moonraker
requirements: scripts/moonraker-requirements.txt

[update_manager mainsail]
type: web
channel: beta
repo: mainsail-crew/mainsail
path: /usr/data/nebulaos/apps/mainsail

[authorization]
trusted_clients:
 127.0.0.1
 192.168.0.0/16
 10.0.0.0/8
cors_domains:
 http://*.local
 http://*.lan
