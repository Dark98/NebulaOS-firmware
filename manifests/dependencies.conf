# Authoritative dependency pin manifest for the NebulaOS firmware build.
#
# One rule: every external source this build depends on has its exact pinned
# ref recorded HERE, and nowhere else. scripts/build/00-fetch-vendor-sources.sh
# sources this file rather than hardcoding pins inline (previously each pin
# lived as a shell variable scattered across that script - functionally
# equivalent, but "the one obvious authoritative file" wasn't obvious).
#
# Format: plain shell variable assignments (this file is `.`-sourced by
# 00-fetch-vendor-sources.sh directly - no parsing dependency, no jq/python
# needed this early in the pipeline). Comments and blank lines allowed.
#
# To bump a pin: edit the value below, in its own reviewed commit, then
# re-run 00-fetch-vendor-sources.sh - it fails loudly if the ref doesn't
# resolve, and re-verifies every pin on every run (not just first clone).
#
# A dependency with NO entry here, or an entry left as the placeholder
# UNPINNED_MUST_SET_BEFORE_BUILD, causes 00-fetch-vendor-sources.sh to fail
# immediately, by design - see its own "required pin" check.

# --- Kernel (coreflake1/NebulaOS, `openke` branch, sparse-checked-out) ---
KERNEL_REPO=https://github.com/coreflake1/NebulaOS.git
KERNEL_BRANCH=openke
KERNEL_PIN=295b7101d751fd888ae39e6f1746a4a940664a5f

# --- Buildroot config for this board family ---
BUILDROOT_REPO=https://github.com/lone0/buildroot-x2000.git
BUILDROOT_PIN=74d020081096972857acdb9e76c6c5335455d430

# --- SimpleAF's real workflow/config/installer repo (config fragments only - see
# 00-fetch-vendor-sources.sh's own comment on which files are actually used) ---
PELLCORP_CREALITY_REPO=https://github.com/pellcorp/creality.git
PELLCORP_CREALITY_PIN=d18d354456a89c20507e574feaa34d6389e679ca

# --- Klipper runtime (this project's own fork - canonical home of
# klippy_extras/: z_compensate.py, prtouch_v2.py, prtouch_probe.py,
# prtouch_nozzle.py, prtouch_mcu.py, tmcstatus.py, etc.) ---
#
# 2026-08-07 baseline-repair mission: bumped from d839d0375a31327e57e0a35e-
# 99e70ba60814ec05 to the commit that reconciles this fork's tracked
# klippy/extras/ with what's actually running on the real printer (the
# z_compensate structured status contract + the load-cell config
# reconciliation fixes, previously local-only/manually-deployed - see
# scripts/build/apply-qualified-baseline.sh's own mission history and
# docs/NEBULAOS_QUALIFIED_BASELINE_VARIANT_AUDIT.md).
#
# Pushed 2026-08-07 (confirmed resolvable from a fresh clone as part of
# this mission's own clean-room reproducibility test).
#
# 2026-08-07 (clean-update mission): KLIPPER_BRANCH switched from
# `nebulaos` to `master` - real bug found live: Moonraker's reserved
# `[update_manager klipper]` slot auto-discovers path/branch from the
# live checkout, and the device's persistent checkout was on `master`
# (the branch Moonraker/factory-seed have always assumed is canonical -
# see S04nebulaos-factory-seed's own doc comment), which was still
# sitting at the OLD pinned commit while every accepted fix landed on a
# separate `nebulaos` side-branch. Fast-forwarded master to the accepted
# HEAD (pure linear fast-forward, verified: master's old tip is a direct
# ancestor of this pin, zero rebase/force-push) rather than repointing
# Moonraker at a second branch - one canonical branch, not two.
# `nebulaos` still exists (unchanged, not deleted/rewritten) as a
# historical record of where this exact commit was first pushed.
KLIPPER_REPO=https://github.com/coreflake1/NebulaOS-klipper.git
KLIPPER_BRANCH=master
KLIPPER_PIN=0e5785dac2cd77451dd6ff192bebb24f1ab2cb2f

