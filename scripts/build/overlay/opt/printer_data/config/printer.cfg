# Ender-3V3KE - real hardware config, adapted from the real device's own
# printer.cfg (fetched read-only via SSH, 2026-07-19, printer confirmed idle
# via a fresh print_stats check first) for SimpleAF's Klipper fork
# (FIRMWARE.md sec 13-17's app-stack plan) rather than Creality's own fork.
#
# Deliberately REMOVED from the real fetched config, and why:
#   - Most [include ...] lines (sensorless.cfg, gcode_macro.cfg,
#     printer_params.cfg, Helper-Script/*.cfg) - none of these files exist in
#     this environment; they're Creality-fork-specific. GuppyScreen/guppy_cmd.cfg
#     is the one exception - it's this project's own port of the real
#     GuppyScreen project's base config (~/Documents/guppyscreen/k1/scripts/),
#     included below now that GuppyScreen itself is integrated (FIRMWARE.md
#     sec 40-41, and the userspace GuppyScreen-startup work that added the
#     persistent storage this depends on).
#   - [prtouch_v2] / [z_compensate] - Creality-specific load-cell modules,
#     not present in SimpleAF's fork. This is exactly the gap Track 1's own
#     klippy_extras/ work (prtouch_v2.py, z_compensate.py, etc. - see
#     ~/Documents/ke-mainline-klipper/klippy_extras/) was written to fill -
#     wiring those in here is real, separate future work, not done in this
#     pass.
#   - [bl24c16f] / [mcu rpi] / [adxl345] / [resonance_tester] - all depend on
#     a separate host-side "klipper_mcu" helper binary (confirmed running on
#     the real device, using /dev/i2c-2 and /dev/spidev2.0) that this
#     app-stack build does not include. Real, separate, out-of-scope work if
#     input-shaper calibration/EEPROM access is wanted later.
#   - The real device's SAVE_CONFIG block (bed_mesh/input_shaper/axis_twist
#     calibration data, TMC autotune) - all measured against the OLD stock
#     kernel/firmware combination; real hardware validation on this new
#     build should re-calibrate fresh rather than trust carried-over numbers
#     blindly, and autotune_tmc specifically isn't confirmed present in
#     SimpleAF's fork at all.
#
# Everything below is the real, physical hardware wiring - the part that's
# genuinely hard to get right from scratch and safe to reuse as-is (the
# physical printer hasn't changed, only the software stack driving it).
# UNTESTED against this custom kernel/rootfs - real-hardware validation
# (FIRMWARE.md's app-stack plan, step 8) is still what actually proves this.

[include GuppyScreen/guppy_cmd.cfg]

[tmcstatus]

[firmware_retraction]
retract_length: 0.6
retract_speed: 35
unretract_extra_length: 0
unretract_speed: 30

[mcu]
serial: /dev/ttyS1
baud: 230400
restart_method: command

[force_move]
enable_force_move: True

[printer]
kinematics: cartesian
max_velocity: 500
max_accel: 8000
max_accel_to_decel: 2500
max_z_velocity: 30
square_corner_velocity: 5.0
max_z_accel: 300

[stepper_x]
step_pin: PC2
dir_pin: !PB9
enable_pin: !PC3
microsteps: 16
rotation_distance: 40
endstop_pin: !PA5
position_endstop: -12
position_min: -12
position_max: 221
homing_speed: 30
homing_retract_dist: 0

[tmc2208 stepper_x]
uart_pin: PB12
interpolate: True
run_current: 0.75
sense_resistor: 0.150
stealthchop_threshold: 0

[stepper_y]
step_pin: PB8
dir_pin: PB7
enable_pin: !PC3
microsteps: 16
rotation_distance: 60
endstop_pin: !PA6
position_endstop: -20
position_min: -20
position_max: 223
homing_speed: 30
homing_retract_dist: 0

[tmc2208 stepper_y]
uart_pin: PB13
interpolate: True
run_current: 0.75
sense_resistor: 0.150
stealthchop_threshold: 0

[stepper_z]
step_pin: PB6
dir_pin: !PB5
enable_pin: !PC3
microsteps: 16
rotation_distance: 8
endstop_pin: probe:z_virtual_endstop
position_max: 246
position_min: -5

[tmc2208 stepper_z]
uart_pin: PB14
interpolate: True
run_current: 0.8
stealthchop_threshold: 0
sense_resistor: 0.150

[bltouch]
sensor_pin: PC14
control_pin: PC13
x_offset: 0
y_offset: 27
probe_with_touch_mode: true
stow_on_each_sample: false
speed: 5
lift_speed: 20

[output_pin MainBoardFan]
pin: !PB1

[extruder]
max_extrude_only_distance: 1000
max_extrude_cross_section: 80
pressure_advance: 0.036
step_pin: PB4
dir_pin: PB3
enable_pin: !PC3
microsteps: 16
rotation_distance: 7.53
nozzle_diameter: 0.400
filament_diameter: 1.750
heater_pin: PA1
sensor_type: EPCOS 100K B57560G104F
sensor_pin: PC5
control: pid
pid_Kp: 20.584
pid_Ki: 1.737
pid_Kd: 60.981
min_temp: 0
max_temp: 320

[heater_bed]
heater_pin: PB2
sensor_type: EPCOS 100K B57560G104F
sensor_pin: PC4
control: pid
pid_kp: 70.652
pid_ki: 1.798
pid_kd: 694.157
min_temp: 0
max_temp: 120

[verify_heater extruder]
[verify_heater heater_bed]
check_gain_time: 120
heating_gain: 1.0
hysteresis: 10

[temperature_sensor mcu_temp]
sensor_type: temperature_mcu
min_temp: 0
max_temp: 100

[output_pin fan0]
pin: PA0
pwm: True
cycle_time: 0.0100
hardware_pwm: false
value: 0.00
scale: 255
shutdown_value: 0.0

[heater_fan nozzle_fan]
pin: PC1
max_power: 1.0
shutdown_speed: 0
cycle_time: 0.010
hardware_pwm: False
kick_start_time: 0.100
off_below: 0.0
heater: extruder
fan_speed: 1.0
heater_temp: 60.0

[bed_mesh]
speed: 350
mesh_min: 5,10
mesh_max: 215,215
probe_count: 9,9
algorithm: bicubic
fade_start: 1
fade_end: 10
fade_target: 0
horizontal_move_z: 8

[input_shaper]

[skew_correction]
