# OpenKE ke-mainline-klipper - Moonraker config for the app-stack proof-of-
# pipeline build (FIRMWARE.md sec 13). klippy_uds_address matches the
# APISOCK path in S55klipper's own invocation of klippy.py.

[server]
host: 0.0.0.0
port: 7125
klippy_uds_address: /opt/printer_data/comms/klippy.sock

[authorization]
trusted_clients:
 192.168.0.0/16
 10.0.0.0/8
cors_domains:
 http://*.local
 http://*.lan
