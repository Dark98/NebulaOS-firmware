# Vendored unmodified from pellcorp/creality (the real "SimpleAF" repo)
# @ d18d354456a89c20507e574feaa34d6389e679ca, config/bltouch_macro.cfg.
# https://github.com/pellcorp/creality/blob/d18d354456a89c20507e574feaa34d6389e679ca/config/bltouch_macro.cfg
# Fetched 2026-07-29. That repo has no declared license anywhere (GitHub API
# reports "license": null) - vendored anyway per explicit user decision, see
# this project's own memory record feedback_simpleaf_license_risk_accepted.md.
#
# Deliberately NOT vendoring the sibling config/bltouch.cfg - that file's
# [bltouch]/[bed_mesh]/[screws_tilt_adjust]/[axis_twist_compensation] sections
# contain unfilled installer template placeholders (literal "999,999" values,
# meant to be sed-substituted by k1/installer.sh at install time), not real
# hardware values. This project's own printer.cfg already has the real,
# physically-qualified [bltouch]/[bed_mesh] sections for this exact printer
# (pins, offsets, mesh bounds fetched from the real device - see printer.cfg's
# own header) - this file only needs the macro wrapper below, which requires
# [bed_mesh] to already be configured (true here) and must be included AFTER
# it in printer.cfg's include order so BED_MESH_CALIBRATE already exists to
# rename.

[gcode_macro BED_MESH_CALIBRATE]
rename_existing: _BED_MESH_CALIBRATE
gcode:
    {% if printer["gcode_macro _SAF_BED_MESH_START"] != null %}
      _SAF_BED_MESH_START
    {% endif %}

    _BED_MESH_CALIBRATE {rawparams}

    {% if printer["gcode_macro _SAF_BED_MESH_END"] != null %}
      _SAF_BED_MESH_END
    {% endif %}
