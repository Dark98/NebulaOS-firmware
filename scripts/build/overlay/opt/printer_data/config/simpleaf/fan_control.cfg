# NebulaOS-authored, not vendored. SimpleAF's real k1/fan_control.f005.cfg
# (the Ender-3 V3 KE / F005 model file in pellcorp/creality) redefines [fan]/
# [heater_fan hotend]/[temperature_sensor mcu_temp] using the exact same pins
# this project's own printer.cfg already has (PA0/PC1) - independent
# confirmation the existing hardware layer is correct. Only the two macros
# below are new: start_end.cfg's CANCEL_PRINT/END_PRINT/_ON_GCODE_FAILURE all
# call TURN_OFF_FANS, which has no mainline Klipper equivalent.

[gcode_macro TURN_OFF_FANS]
description: Stop chamber, auxiliary and part fan
gcode:
    M107

[gcode_macro TURN_ON_FANS]
description: Turn on chamber, auxiliary and part fan
gcode:
    M106 S255
